name: Update recent pull requests

on:
  schedule:
    - cron: "0 4 * * 1,4"
  workflow_dispatch:

concurrency:
  group: recent-prs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Collect and write the six most recently updated external pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            "/search/issues?q=author:${{ github.repository_owner }}+type:pr+-is:unmerged+-user:${{ github.repository_owner }}+-repo:deed-lang/deed+-repo:deed-lang/deed-lang.github.io+-repo:atlas-depot/atlas&sort=updated&order=desc&per_page=6" \
            --jq '.items[] | "- [\(.title)](\(.html_url)) on **\(.repository_url | sub(".*/repos/"; ""))**"' \
            | python .github/scripts/update_readme.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet --cached && echo "no change" && exit 0
          git commit -m "Update recent pull requests"
          git push
